name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build C++ oracle and regenerate golden traces
        run: make -C tools/oracle && tools/oracle/gen-golden.sh && git diff --exit-code testdata/golden
      - run: go vet ./...
      - run: go test ./...
      - run: GOOS=js GOARCH=wasm go build -o /tmp/wmips.wasm ./cmd/wasm

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: curl -fsS localhost:8080/healthz && curl -fsS localhost:8080/api/examples | head -c 200
      - if: always()
        run: docker compose down
